plugins {
    id 'com.android.library' version '8.13.2'
    id 'org.jetbrains.kotlin.android' version '2.2.20'
    id 'maven-publish'
}

android {
    namespace 'ro.sparktech24345.logicore'
    //noinspection GradleDependency
    compileSdk 30

    defaultConfig {
        minSdk 24
        //noinspection ExpiredTargetSdkVersion
        targetSdk 28
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    configurations.configureEach {
        resolutionStrategy.eachDependency { DependencyResolveDetails details ->
            if (details.requested.group == 'org.firstinspires.ftc') {
                details.useVersion '11.2.1'
            }
        }
    }

    publishing {
        singleVariant("release") {
            withSourcesJar()
        }
    }
}

dependencies {
    //noinspection Aligned16KB
    compileOnly 'org.firstinspires.ftc:RobotCore:11.2.1'
    compileOnly 'org.firstinspires.ftc:Hardware:11.2.1'
    compileOnly 'org.firstinspires.ftc:FtcCommon:11.2.1'
    compileOnly 'org.firstinspires.ftc:Vision:11.2.1'

    implementation 'dev.frozenmilk.dairy:CachingHardware:1.0.0'
    implementation 'org.solverslib:photon:0.3.5'
}

publishing {
    publications {
        release(MavenPublication) {
            groupId = 'ro.sparktech24345'
            artifactId = 'logicore'
            version = '1.0.0'

            afterEvaluate {
                from components.release
            }
        }
    }
}
